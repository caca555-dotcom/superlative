    <!-- Audio Synthesizer (Web Audio API) Script -->
    <script>
        // Web Audio API context for zero-external-dependency sound FX
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                // Happy arpeggio
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.15);
                });
            } else if (type === 'wrong') {
                // Low buzz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'fanfare') {
                // Level Win flourish
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.12);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.3);
                });
            }
        }
    </script>

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // Clear, lively speed
                utterance.pitch = 1.25; // Higher pitch for a friendly, cheerful, younger tone

                // Try to find a female/cheerful voice from available browser voices
                const voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    const femaleVoice = voices.find(v => 
                        v.lang.startsWith('en') && 
                        (v.name.includes('Female') || 
                         v.name.includes('Samantha') || 
                         v.name.includes('Victoria') || 
                         v.name.includes('Zira') || 
                         v.name.includes('Karen') || 
                         v.name.includes('Google US English') ||
                         v.name.includes('Fiona') ||
                         v.name.includes('Jenny'))
                    );
                    if (femaleVoice) {
                        utterance.voice = femaleVoice;
                    }
                }

                window.speechSynthesis.speak(utterance);
            }

        // --- Answer Checking Logic ---
        function checkAnswer(selectedIdx) {
            const questions = getCurrentLevelQuestions();
            const q = questions[currentQuestionIdx];
            const isCorrect = q.options[selectedIdx].correct;

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-400', 'bg-red-100', 'text-red-800', 'border-red-400');

            if (isCorrect) {
                playSound('correct');
                totalScore += 10;
                document.getElementById('score-display').innerText = totalScore;

                const msg = encouragingMessages[Math.floor(Math.random() * encouragingMessages.length)];
                feedbackBox.classList.add('bg-emerald-100', 'text-emerald-800', 'border-2', 'border-emerald-400');
                feedbackBox.innerHTML = `<div>${msg}</div>`;

                // Disable option buttons briefly
                const btns = document.querySelectorAll('#options-grid button');
                btns.forEach((btn, idx) => {
                    btn.disabled = true;
                    if (idx === selectedIdx) {
                        btn.className = 'bg-emerald-500 text-white font-extrabold p-3 sm:py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 text-base sm:text-lg';
                    } else {
                        btn.classList.add('opacity-40');
                    }
                });

                setTimeout(() => {
                    currentQuestionIdx++;
                    if (currentQuestionIdx < questions.length) {
                        renderQuestion();
                    } else {
                        finishLevel();
                    }
                }, 1300);

            } else {
                playSound('wrong');
                feedbackBox.classList.add('bg-red-100', 'text-red-800', 'border-2', 'border-red-400');
                feedbackBox.innerHTML = `
                    <div>❌ Oops! Try again!</div>
                    <div class="text-xs font-semibold mt-1 text-red-600">💡 Hint: ${q.hint}</div>
                `;
            }
        }
